name: ParkPulse landing checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  landing:
    name: Landing page 2.0 browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check landing JavaScript syntax
        run: node --check site.js
      - name: Install pinned browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static landing server
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/parkpulse-landing.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8767/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/parkpulse-landing.log
          exit 1
      - name: Test six-park resort preview and responsive layouts
        run: node tests/landing-smoke.cjs
